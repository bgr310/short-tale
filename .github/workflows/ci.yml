name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks needs history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
      - name: repo hygiene
        run: ./scripts/check_secrets.sh

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings pyyaml pillow numpy \
                      sqlalchemy httpx tenacity fastapi 'jinja2>=3.1' \
                      python-multipart pytest
      - name: pytest
        env:
          VIDEO_ENCODER: cpu
        run: python -m pytest tests -q
