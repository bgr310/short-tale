[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shorttale"
version = "0.1.0"
description = "Fully local, GPU-accelerated YouTube Shorts / TikTok generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
shorttale = "shorttale.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorttale = [
    "fixtures/*.json",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
